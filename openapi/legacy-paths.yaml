      description: Searches Taxes records. Use fields=taxName,taxValue as a starting point.
      parameters:
        - description: Search text for Taxes.
          in: query
          name: q
          schema:
            type: string
        - description: 'Comma-separated Taxes fields. Example: taxName,taxValue'
          in: query
          name: fields
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Taxes search results.
      security:
        - bearerAuth: []
      summary: Search Taxes
      tags:
        - Taxes
  /api/taxes/summary:
    get:
      description: Returns summary counts for Taxes records.
      parameters:
        - description: Optional field name on Taxes.
          in: query
          name: filter
          schema:
            type: string
        - description: Optional exact field value to match.
          in: query
          name: equal
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Taxes summary.
      security:
        - bearerAuth: []
      summary: Summarize Taxes
      tags:
        - Taxes
  /api/taxes/update/{id}:
    patch:
      description: Updates one Taxes record by MongoDB id.
      parameters:
        - description: Taxes id.
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Taxes'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Taxes updated.
      security:
        - bearerAuth: []
      summary: Update Taxes
      tags:
        - Taxes
  /download/{directory}/{file}:
    get:
      parameters:
        - description: Download directory.
          in: path
          name: directory
          required: true
          schema:
            type: string
        - description: File name.
          in: path
          name: file
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/pdf:
              schema:
                format: binary
                type: string
          description: File download.
      summary: Download generated PDF
      tags:
        - Files
  /public/{subPath}/{directory}/{file}:
    get:
      parameters:
        - description: Public subpath.
          in: path
          name: subPath
          required: true
          schema:
            type: string
        - description: Public directory.
          in: path
          name: directory
          required: true
          schema:
            type: string
        - description: File name.
          in: path
          name: file
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: Public file.
      summary: Get public file
      tags:
        - Files
