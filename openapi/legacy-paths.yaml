paths:
  /api/admin/api-key/create:
    post:
      description: Creates an API key that external systems can use to call protected ERP API routes.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminApiKeyCreateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: API key created. Full key is returned once.
      security:
        - bearerAuth: []
      summary: Create inbound API key
      tags:
        - Admin API Keys
  /api/admin/api-key/list:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: API keys returned.
      security:
        - bearerAuth: []
      summary: List inbound API keys
      tags:
        - Admin API Keys
  /api/admin/api-key/revoke/{id}:
    patch:
      parameters:
        - description: API key id.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: API key revoked.
      security:
        - bearerAuth: []
      summary: Revoke inbound API key
      tags:
        - Admin API Keys
  /api/admin/create:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Admin'
        required: true
      responses:
        '200':
          content:
