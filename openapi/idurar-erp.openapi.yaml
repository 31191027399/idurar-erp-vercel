openapi: 3.0.3
info:
  title: IDURAR ERP API
  version: 1.0.0
  description: >
    OpenAPI specification for the current Express routes in this repository.
    ERP routes are documented as explicit entity paths, for example /api/client/search
    and /api/invoice/search, so external systems do not need to infer an entity parameter.
servers:
  - url: http://localhost:8888
    description: Local backend
  - url: https://idurar-erp-vercel.vercel.app
    description: Vercel deployment
tags:
  - name: Auth
  - name: Admin
  - name: Admin API Keys
  - name: Integration Settings
  - name: Settings
  - name: Client
  - name: Invoice
  - name: Payment
  - name: Payment Mode
  - name: Quote
  - name: Taxes
  - name: Files
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        result:
          nullable: true
        message:
          type: string
    Pagination:
      type: object
      properties:
        page:
          type: integer
        pages:
          type: integer
        count:
          type: integer
    PaginatedResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        remember:
          type: boolean
    ForgetPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [userId, resetToken, password]
      properties:
        userId:
          type: string
        resetToken:
          type: string
        password:
          type: string
    Admin:
      type: object
      properties:
        _id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        surname:
          type: string
        photo:
          type: string
        enabled:
          type: boolean
        role:
          type: string
          enum: [owner, admin, manager, employee, create_only, read_only]
    AdminApiKeyCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        expiresInDays:
          type: integer
          nullable: true
    AdminApiKey:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        key:
          type: string
          description: Returned only once after creation.
        keyPrefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean
    IntegrationSettings:
      type: object
      required: [serviceName, baseUrl, apiKey]
      properties:
        serviceName:
          type: string
          example: Stripe
        baseUrl:
          type: string
          format: uri
          example: https://api.example.com
        apiKey:
          type: string
          format: password
        hasApiKey:
          type: boolean
          readOnly: true
    Setting:
      type: object
      properties:
        _id:
          type: string
        settingCategory:
          type: string
        settingKey:
          type: string
        settingValue: {}
        valueType:
          type: string
        isPrivate:
          type: boolean
        isCoreSetting:
          type: boolean
        enabled:
          type: boolean
    Client:
      type: object
      required: [name]
      properties:
        _id:
          type: string
        name:
          type: string
        phone:
          type: string
        country:
          type: string
        address:
          type: string
        email:
          type: string
          format: email
        createdBy:
          type: string
        assigned:
          type: string
        enabled:
          type: boolean
    LineItem:
      type: object
      required: [itemName, quantity, price, total]
      properties:
        itemName:
          type: string
        description:
          type: string
        quantity:
          type: number
        price:
          type: number
        total:
          type: number
    Quote:
      type: object
      properties:
        _id:
          type: string
        number:
          type: integer
        year:
          type: integer
        date:
          type: string
          format: date-time
        expiredDate:
          type: string
          format: date-time
        client:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        taxRate:
          type: number
        subTotal:
          type: number
        taxTotal:
          type: number
        total:
          type: number
        currency:
          type: string
        discount:
          type: number
        status:
          type: string
        notes:
          type: string
    Invoice:
      type: object
      properties:
        _id:
          type: string
        number:
          type: integer
        year:
          type: integer
        date:
          type: string
          format: date-time
        expiredDate:
          type: string
          format: date-time
        client:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        taxRate:
          type: number
        subTotal:
          type: number
        taxTotal:
          type: number
        total:
          type: number
        currency:
          type: string
        credit:
          type: number
        discount:
          type: number
        paymentStatus:
          type: string
        status:
          type: string
        notes:
          type: string
    Payment:
      type: object
      properties:
        _id:
          type: string
        number:
          type: integer
        client:
          type: string
        invoice:
          type: string
        date:
          type: string
          format: date-time
        amount:
          type: number
        currency:
          type: string
        ref:
          type: string
        description:
          type: string
    PaymentMode:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        isDefault:
          type: boolean
        enabled:
          type: boolean
    Taxes:
      type: object
      properties:
        _id:
          type: string
        taxName:
          type: string
        taxValue:
          type: string
        isDefault:
          type: boolean
        enabled:
          type: boolean
    MaintenanceSeedRequest:
      type: object
      properties:
        clean:
          type: boolean
          default: true
        counts:
          type: object
          properties:
            clients:
              type: integer
            quotes:
              type: integer
            invoices:
              type: integer
            payments:
              type: integer
    MailRequest:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
paths:
  /api/login:
    post:
      tags: [Auth]
      summary: Login
      description: Authenticates an admin user and returns a bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/forgetpassword:
    post:
      tags: [Auth]
      summary: Send password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgetPasswordRequest'
      responses:
        '200':
          description: Reset email triggered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/resetpassword:
    post:
      tags: [Auth]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Logout success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/create:
    post:
      tags: [Admin]
      summary: Create admin
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Admin'
      responses:
        '200':
          description: Admin created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/read/{id}:
    get:
      tags: [Admin]
      summary: Read admin
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: "Admin id."
          schema:
            type: string
      responses:
        '200':
          description: Admin found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/update/{id}:
    patch:
      tags: [Admin]
      summary: Update admin
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: "Admin id."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Admin'
      responses:
        '200':
          description: Admin updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/delete/{id}:
    delete:
      tags: [Admin]
      summary: Delete admin
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: "Admin id."
          schema:
            type: string
      responses:
        '200':
          description: Admin deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/list:
    get:
      tags: [Admin]
      summary: List admins
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          description: "Page number."
          schema:
            type: integer
        - name: items
          in: query
          description: "Items per page."
          schema:
            type: integer
        - name: sortBy
          in: query
          description: "Field to sort by."
          schema:
            type: string
        - name: sortValue
          in: query
          description: "Use 1 for ascending or -1 for descending."
          schema:
            type: integer
        - name: q
          in: query
          description: "Search text."
          schema:
            type: string
        - name: fields
          in: query
          description: "Comma-separated fields to search. Example: name,email"
          schema:
            type: string
        - name: filter
          in: query
          description: "Field name to filter."
          schema:
            type: string
        - name: equal
          in: query
          description: "Exact value for the filter field."
          schema:
            type: string
      responses:
        '200':
          description: Paginated admin list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
  /api/admin/search:
    get:
      tags: [Admin]
      summary: Search admins
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          description: "Search text for admins."
          schema:
            type: string
        - name: fields
          in: query
          description: "Comma-separated admin fields. Example: name,email"
          schema:
            type: string
      responses:
        '200':
          description: Admin search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/password-update/{id}:
    patch:
      tags: [Admin]
      summary: Update another admin password
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: "Admin id."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/profile/password:
    patch:
      tags: [Admin]
      summary: Update current profile password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Profile password updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/profile/update:
    patch:
      tags: [Admin]
      summary: Update current profile
      description: Updates current admin profile and optionally uploads a profile photo.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                surname:
                  type: string
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/maintenance/clean:
    post:
      tags: [Admin]
      summary: Clean ERP demo data
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Clean success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/maintenance/seed:
    post:
      tags: [Admin]
      summary: Seed ERP demo data
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceSeedRequest'
      responses:
        '200':
          description: Seed success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/api-key/create:
    post:
      tags: [Admin API Keys]
      summary: Create inbound API key
      description: Creates an API key that external systems can use to call protected ERP API routes.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminApiKeyCreateRequest'
      responses:
        '200':
          description: API key created. Full key is returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/api-key/list:
    get:
      tags: [Admin API Keys]
      summary: List inbound API keys
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: API keys returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/api-key/revoke/{id}:
    patch:
      tags: [Admin API Keys]
      summary: Revoke inbound API key
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: "API key id."
          schema:
            type: string
      responses:
        '200':
          description: API key revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/integration-settings:
    get:
      tags: [Integration Settings]
      summary: Read third-party integration settings
      description: Returns the saved outbound integration service name, base URL, and API key for authenticated admins.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Integration settings returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    patch:
      tags: [Integration Settings]
      summary: Update third-party integration settings
      description: Saves outbound credentials used when this ERP connects to another third-party system.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationSettings'
      responses:
        '200':
          description: Integration settings updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/setting/create:
    post:
      tags: [Settings]
      summary: Create setting
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Setting'
      responses:
        '200':
          description: Setting created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/setting/read/{id}:
    get:
      tags: [Settings]
      summary: Read setting
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: "Setting id."
          schema:
            type: string
      responses:
        '200':
          description: Setting found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/setting/update/{id}:
    patch:
      tags: [Settings]
      summary: Update setting
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: "Setting id."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Setting'
      responses:
        '200':
          description: Setting updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/setting/search:
    get:
      tags: [Settings]
      summary: Search settings
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          description: "Search text for settings."
          schema:
            type: string
        - name: fields
          in: query
          description: "Comma-separated setting fields. Example: settingKey,settingCategory"
          schema:
            type: string
      responses:
        '200':
          description: Setting search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/setting/list:
    get:
      tags: [Settings]
      summary: List settings
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          description: "Page number."
          schema:
            type: integer
        - name: items
          in: query
          description: "Items per page."
          schema:
            type: integer
        - name: sortBy
          in: query
          description: "Field to sort by."
          schema:
            type: string
        - name: sortValue
          in: query
          description: "Use 1 for ascending or -1 for descending."
          schema:
            type: integer
        - name: q
          in: query
          description: "Search text."
          schema:
            type: string
        - name: fields
          in: query
          description: "Comma-separated fields to search. Example: name,email"
          schema:
            type: string
        - name: filter
          in: query
          description: "Field name to filter."
          schema:
            type: string
        - name: equal
          in: query
          description: "Exact value for the filter field."
          schema:
            type: string
      responses:
        '200':
          description: Paginated settings list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
  /api/setting/listAll:
    get:
      tags: [Settings]
      summary: List all public settings
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All public settings returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/setting/filter:
    get:
      tags: [Settings]
      summary: Filter settings
      security: [{ bearerAuth: [] }]
      parameters:
        - name: filter
          in: query
          description: "Setting field name."
          schema:
            type: string
        - name: equal
          in: query
          description: "Exact field value to match."
          schema:
            type: string
      responses:
        '200':
          description: Filtered settings returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/setting/readBySettingKey/{settingKey}:
    get:
      tags: [Settings]
      summary: Read setting by key
      security: [{ bearerAuth: [] }]
      parameters:
        - name: settingKey
          in: path
          required: true
          description: "Setting key, for example idurar_app_date_format."
          schema:
            type: string
      responses:
        '200':
          description: Setting returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/setting/listBySettingKey:
    get:
      tags: [Settings]
      summary: List settings by key
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Settings returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/setting/updateBySettingKey/{settingKey}:
    patch:
      tags: [Settings]
      summary: Update setting by key
      security: [{ bearerAuth: [] }]
      parameters:
        - name: settingKey
          in: path
          required: true
          description: "Setting key to update."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settingValue]
              properties:
                settingValue: {}
      responses:
        '200':
          description: Setting updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/setting/upload/{settingKey}:
    patch:
      tags: [Settings]
      summary: Upload setting value file
      security: [{ bearerAuth: [] }]
      parameters:
        - name: settingKey
          in: path
          required: true
          description: "Setting key to update."
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                settingValue:
                  type: string
                  format: binary
      responses:
        '200':
          description: Setting file uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/setting/updateManySetting:
    patch:
      tags: [Settings]
      summary: Bulk update settings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: array
                  items:
                    type: object
                    required: [settingKey, settingValue]
                    properties:
                      settingKey:
                        type: string
                      settingValue: {}
      responses:
        '200':
          description: Settings updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/client/create:
    post:
      tags: [Client]
      summary: Create Client
      description: Creates one Client record.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Client'
      responses:
        '200':
          description: Client created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/client/read/{id}:
    get:
      tags: [Client]
      summary: Read Client
      description: Returns one Client record by MongoDB id.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: "Client id."
          schema:
            type: string
      responses:
        '200':
          description: Client found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/client/update/{id}:
    patch:
      tags: [Client]
      summary: Update Client
      description: Updates one Client record by MongoDB id.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: "Client id."
          schema:
            type: string
      requestBody:
        required: true
        content:
