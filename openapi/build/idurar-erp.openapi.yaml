components:
  schemas:
    Admin:
      properties:
        _id:
          type: string
        email:
          format: email
          type: string
        enabled:
          type: boolean
        name:
          type: string
        photo:
          type: string
        role:
          enum:
            - owner
            - admin
            - manager
            - employee
            - create_only
            - read_only
          type: string
        surname:
          type: string
      type: object
    AdminApiKey:
      properties:
        _id:
          type: string
        expiresAt:
          format: date-time
          nullable: true
          type: string
        key:
          description: Returned only once after creation.
          type: string
        keyPrefix:
          type: string
        name:
          type: string
        revoked:
          type: boolean
        scopes:
          items:
            type: string
          type: array
      type: object
    AdminApiKeyCreateRequest:
      properties:
        expiresInDays:
          nullable: true
          type: integer
        name:
          type: string
        scopes:
          items:
            type: string
          type: array
      required:
        - name
      type: object
    ApiResponse:
      properties:
        message:
          type: string
        result:
          nullable: true
        success:
          type: boolean
      type: object
    Client:
      properties:
        _id:
          type: string
        address:
          type: string
        assigned:
          type: string
        country:
          type: string
        createdBy:
          type: string
        email:
          format: email
          type: string
        enabled:
          type: boolean
        name:
          type: string
        phone:
          type: string
      required:
        - name
      type: object
    ForgetPasswordRequest:
      properties:
        email:
          format: email
          type: string
      required:
        - email
      type: object
    IntegrationSettings:
      properties:
        apiKey:
          format: password
          type: string
        baseUrl:
          example: https://api.example.com
          format: uri
          type: string
        hasApiKey:
          readOnly: true
          type: boolean
        serviceName:
          example: Stripe
          type: string
      required:
        - serviceName
        - baseUrl
        - apiKey
      type: object
    Invoice:
      properties:
        _id:
          type: string
        client:
          type: string
        credit:
          type: number
        currency:
          type: string
        date:
          format: date-time
          type: string
        discount:
          type: number
        expiredDate:
          format: date-time
          type: string
        items:
          items:
            $ref: '#/components/schemas/LineItem'
          type: array
        notes:
          type: string
        number:
          type: integer
        paymentStatus:
          type: string
        status:
          type: string
        subTotal:
          type: number
        taxRate:
          type: number
        taxTotal:
          type: number
        total:
          type: number
        year:
          type: integer
      type: object
    LineItem:
      properties:
        description:
          type: string
        itemName:
          type: string
        price:
          type: number
        quantity:
          type: number
        total:
          type: number
      required:
        - itemName
        - quantity
        - price
        - total
      type: object
    LoginRequest:
      properties:
        email:
          format: email
          type: string
        password:
          type: string
        remember:
          type: boolean
      required:
        - email
        - password
      type: object
    MailRequest:
      properties:
        email:
          format: email
          type: string
        id:
          type: string
      type: object
    MaintenanceSeedRequest:
      properties:
        clean:
          default: true
          type: boolean
        counts:
          properties:
            clients:
              type: integer
            invoices:
              type: integer
            payments:
              type: integer
            quotes:
              type: integer
          type: object
      type: object
    PaginatedResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - properties:
            pagination:
              $ref: '#/components/schemas/Pagination'
          type: object
    Pagination:
      properties:
        count:
          type: integer
        page:
          type: integer
        pages:
          type: integer
      type: object
    Payment:
      properties:
        _id:
          type: string
        amount:
          type: number
        client:
          type: string
        currency:
          type: string
        date:
          format: date-time
          type: string
        description:
          type: string
        invoice:
          type: string
        number:
          type: integer
        ref:
          type: string
      type: object
    PaymentMode:
      properties:
        _id:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        isDefault:
          type: boolean
        name:
          type: string
      type: object
    Quote:
      properties:
        _id:
          type: string
        client:
          type: string
        currency:
          type: string
        date:
          format: date-time
          type: string
        discount:
          type: number
        expiredDate:
          format: date-time
          type: string
        items:
          items:
            $ref: '#/components/schemas/LineItem'
          type: array
        notes:
          type: string
        number:
          type: integer
        status:
          type: string
        subTotal:
          type: number
        taxRate:
          type: number
        taxTotal:
          type: number
        total:
          type: number
        year:
          type: integer
      type: object
    ResetPasswordRequest:
      properties:
        password:
          type: string
        resetToken:
          type: string
        userId:
          type: string
      required:
        - userId
        - resetToken
        - password
      type: object
    Setting:
      properties:
        _id:
          type: string
        enabled:
          type: boolean
        isCoreSetting:
          type: boolean
        isPrivate:
          type: boolean
        settingCategory:
          type: string
        settingKey:
          type: string
        settingValue: {}
        valueType:
          type: string
      type: object
    Taxes:
      additionalProperties: false
      description: A tax rate applicable to invoice line items.
      properties:
        _id:
          format: objectid
          readOnly: true
          type: string
        createdAt:
          format: date-time
          readOnly: true
          type: string
        enabled:
          description: Soft-disable a tax rate without deleting it.
          type: boolean
        isDefault:
          description: Whether this tax rate is the default applied to new invoices.
          type: boolean
        removed:
          readOnly: true
          type: boolean
        taxName:
          description: Human-readable name of the tax (e.g. "VAT", "Sales Tax").
          example: VAT
          type: string
        taxValue:
          description: >-
            Tax rate as a string (e.g. "5", "7.5"). Stored as string per model; clients should parse
            for arithmetic.
          example: '7.5'
          type: string
        updatedAt:
          format: date-time
          readOnly: true
          type: string
      type: object
    TaxesCreate:
      additionalProperties: false
      description: A tax rate applicable to invoice line items.
      properties:
        enabled:
          description: Soft-disable a tax rate without deleting it.
          type: boolean
          writeOnly: true
        isDefault:
          description: Whether this tax rate is the default applied to new invoices.
          type: boolean
          writeOnly: true
        taxName:
          description: Human-readable name of the tax (e.g. "VAT", "Sales Tax").
          example: VAT
          type: string
          writeOnly: true
        taxValue:
          description: >-
            Tax rate as a string (e.g. "5", "7.5"). Stored as string per model; clients should parse
            for arithmetic.
          example: '7.5'
          type: string
          writeOnly: true
      required:
        - taxName
        - taxValue
      type: object
    TaxesResponse:
      $ref: '#/components/schemas/Taxes'
    TaxesUpdate:
      additionalProperties: false
      description: A tax rate applicable to invoice line items.
      properties:
        enabled:
          description: Soft-disable a tax rate without deleting it.
          type: boolean
        isDefault:
          description: Whether this tax rate is the default applied to new invoices.
          type: boolean
        taxName:
          description: Human-readable name of the tax (e.g. "VAT", "Sales Tax").
          example: VAT
          type: string
        taxValue:
          description: >-
            Tax rate as a string (e.g. "5", "7.5"). Stored as string per model; clients should parse
            for arithmetic.
          example: '7.5'
          type: string
      type: object
  securitySchemes:
    apiKeyAuth:
      in: header
      name: X-API-Key
      type: apiKey
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: |-
    OpenAPI specification for the current Express routes in this repository.
    Entity schemas are GENERATED from Mongoose models + authored *.openapi.js declarations.
    Do not edit openapi/build/* by hand; run `npm run spec:gen`.
  title: IDURAR ERP API
  version: 1.0.0
openapi: 3.0.3
paths:
  /api/admin/api-key/create:
    post:
      description: Creates an API key that external systems can use to call protected ERP API routes.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminApiKeyCreateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: API key created. Full key is returned once.
      security:
        - bearerAuth: []
      summary: Create inbound API key
      tags:
        - Admin API Keys
  /api/admin/api-key/list:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: API keys returned.
      security:
        - bearerAuth: []
      summary: List inbound API keys
      tags:
        - Admin API Keys
  /api/admin/api-key/revoke/{id}:
    patch:
      parameters:
        - description: API key id.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: API key revoked.
      security:
        - bearerAuth: []
      summary: Revoke inbound API key
      tags:
        - Admin API Keys
  /api/admin/create:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Admin'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Admin created.
      security:
        - bearerAuth: []
      summary: Create admin
      tags:
        - Admin
  /api/admin/delete/{id}:
    delete:
      parameters:
        - description: Admin id.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Admin deleted.
      security:
        - bearerAuth: []
      summary: Delete admin
      tags:
        - Admin
  /api/admin/integration-settings:
    get:
      description: >-
        Returns the saved outbound integration service name, base URL, and API key for authenticated
        admins.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Integration settings returned.
      security:
        - bearerAuth: []
      summary: Read third-party integration settings
      tags:
        - Integration Settings
    patch:
      description: Saves outbound credentials used when this ERP connects to another third-party system.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationSettings'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Integration settings updated.
      security:
        - bearerAuth: []
      summary: Update third-party integration settings
      tags:
        - Integration Settings
  /api/admin/list:
    get:
      parameters:
        - description: Page number.
          in: query
          name: page
          schema:
            type: integer
        - description: Items per page.
          in: query
          name: items
          schema:
            type: integer
        - description: Field to sort by.
          in: query
          name: sortBy
          schema:
            type: string
        - description: Use 1 for ascending or -1 for descending.
          in: query
          name: sortValue
          schema:
            type: integer
        - description: Search text.
          in: query
          name: q
          schema:
            type: string
        - description: 'Comma-separated fields to search. Example: name,email'
          in: query
          name: fields
          schema:
            type: string
        - description: Field name to filter.
          in: query
          name: filter
          schema:
            type: string
        - description: Exact value for the filter field.
          in: query
          name: equal
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
          description: Paginated admin list.
      security:
        - bearerAuth: []
      summary: List admins
      tags:
        - Admin
  /api/admin/maintenance/clean:
    post:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Clean success.
      security:
        - bearerAuth: []
      summary: Clean ERP demo data
      tags:
        - Admin
  /api/admin/maintenance/seed:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceSeedRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Seed success.
      security:
        - bearerAuth: []
      summary: Seed ERP demo data
      tags:
        - Admin
  /api/admin/password-update/{id}:
    patch:
      parameters:
        - description: Admin id.
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                password:
                  type: string
              required:
                - password
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Password updated.
      security:
        - bearerAuth: []
      summary: Update another admin password
      tags:
        - Admin
  /api/admin/profile/password:
    patch:
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Profile password updated.
      security:
        - bearerAuth: []
      summary: Update current profile password
      tags:
        - Admin
  /api/admin/profile/update:
    patch:
      description: Updates current admin profile and optionally uploads a profile photo.
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                name:
                  type: string
                photo:
                  format: binary
                  type: string
                surname:
                  type: string
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Profile updated.
      security:
        - bearerAuth: []
      summary: Update current profile
      tags:
        - Admin
  /api/admin/read/{id}:
    get:
      parameters:
        - description: Admin id.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Admin found.
      security:
        - bearerAuth: []
      summary: Read admin
      tags:
        - Admin
  /api/admin/search:
    get:
      parameters:
        - description: Search text for admins.
          in: query
          name: q
          schema:
            type: string
        - description: 'Comma-separated admin fields. Example: name,email'
          in: query
          name: fields
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Admin search results.
      security:
        - bearerAuth: []
      summary: Search admins
      tags:
        - Admin
  /api/admin/update/{id}:
    patch:
      parameters:
        - description: Admin id.
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Admin'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Admin updated.
      security:
        - bearerAuth: []
      summary: Update admin
      tags:
        - Admin
  /api/client/create:
    post:
      description: Creates one Client record.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Client'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Client created.
      security:
        - bearerAuth: []
      summary: Create Client
      tags:
        - Client
  /api/client/delete/{id}:
    delete:
      description: Soft-deletes one Client record by MongoDB id.
      parameters:
        - description: Client id.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Client deleted.
      security:
        - bearerAuth: []
      summary: Delete Client
      tags:
        - Client
  /api/client/filter:
    get:
      description: Filters Client records by one field and exact value.
      parameters:
        - description: Field name on Client.
          in: query
          name: filter
          schema:
            type: string
        - description: Exact field value to match.
          in: query
          name: equal
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Filtered Client records.
      security:
        - bearerAuth: []
      summary: Filter Client
      tags:
        - Client
  /api/client/list:
    get:
      description: Returns paginated Client records with optional search, sort, and filter query parameters.
      parameters:
        - description: Page number.
          in: query
          name: page
          schema:
            type: integer
        - description: Items per page.
          in: query
          name: items
          schema:
            type: integer
        - description: Field to sort by.
          in: query
          name: sortBy
          schema:
            type: string
        - description: Use 1 for ascending or -1 for descending.
          in: query
          name: sortValue
          schema:
            type: integer
        - description: Search text.
          in: query
          name: q
          schema:
            type: string
        - description: 'Comma-separated fields to search. Example: name,email'
          in: query
          name: fields
          schema:
            type: string
        - description: Field name to filter.
          in: query
          name: filter
          schema:
            type: string
        - description: Exact value for the filter field.
          in: query
          name: equal
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
          description: Paginated Client list.
      security:
        - bearerAuth: []
      summary: List Client
      tags:
        - Client
  /api/client/listAll:
    get:
      description: Returns all Client records.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: All Client records.
      security:
        - bearerAuth: []
      summary: List all Client
      tags:
        - Client
  /api/client/read/{id}:
    get:
      description: Returns one Client record by MongoDB id.
      parameters:
        - description: Client id.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Client found.
      security:
        - bearerAuth: []
      summary: Read Client
      tags:
        - Client
  /api/client/search:
    get:
      description: Searches Client records. Use fields=name,email,phone as a starting point.
      parameters:
        - description: Search text for Client.
          in: query
          name: q
          schema:
            type: string
        - description: 'Comma-separated Client fields. Example: name,email,phone'
          in: query
          name: fields
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Client search results.
      security:
        - bearerAuth: []
      summary: Search Client
      tags:
        - Client
  /api/client/summary:
    get:
      description: Returns summary counts for Client records.
      parameters:
        - description: Optional field name on Client.
          in: query
          name: filter
          schema:
            type: string
        - description: Optional exact field value to match.
          in: query
          name: equal
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Client summary.
      security:
        - bearerAuth: []
      summary: Summarize Client
      tags:
        - Client
  /api/client/update/{id}:
    patch:
      description: Updates one Client record by MongoDB id.
      parameters:
        - description: Client id.
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Client'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Client updated.
      security:
        - bearerAuth: []
      summary: Update Client
      tags:
        - Client
  /api/forgetpassword:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgetPasswordRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Reset email triggered.
      summary: Send password reset email
      tags:
        - Auth
  /api/invoice/create:
    post:
      description: Creates one Invoice record.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invoice'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Invoice created.
      security:
        - bearerAuth: []
      summary: Create Invoice
      tags:
        - Invoice
  /api/invoice/delete/{id}:
    delete:
      description: Soft-deletes one Invoice record by MongoDB id.
      parameters:
        - description: Invoice id.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Invoice deleted.
      security:
        - bearerAuth: []
      summary: Delete Invoice
      tags:
        - Invoice
  /api/invoice/filter:
    get:
      description: Filters Invoice records by one field and exact value.
      parameters:
        - description: Field name on Invoice.
          in: query
          name: filter
          schema:
            type: string
        - description: Exact field value to match.
          in: query
          name: equal
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          description: Filtered Invoice records.
      security:
        - bearerAuth: []
      summary: Filter Invoice
      tags:
        - Invoice
  /api/invoice/list:
    get:
      description: Returns paginated Invoice records with optional search, sort, and filter query parameters.
      parameters:
        - description: Page number.
